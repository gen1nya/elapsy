kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# AGP 9 no longer keeps the default constructor for a bare "-keep class" rule. WorkManager and Room
# (both pulled in by Glance) still ship such rules and instantiate those classes reflectively, which
# crashed the release build on launch and froze the widget.
android.r8.strictFullModeForKeepRules=false
